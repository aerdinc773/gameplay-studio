<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Engine — Master Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: #e8e8e8;
        }

        header {
            padding: 25px;
            background: #171a21;
            border-bottom: 1px solid #292d36;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 8px 0 0;
            color: #8f96a3;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #171a21;
            border: 1px solid #292d36;
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
        }

        .panel h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            resize: vertical;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #343945;
            background: #0f1115;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #5865f2;
        }

        button {
            margin-top: 10px;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #5865f2;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .content {
            margin-top: 20px;
        }

        .item {
            background: #0f1115;
            border: 1px solid #292d36;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .date {
            color: #7f8794;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .empty {
            color: #777f8c;
            font-style: italic;
        }

        @media (max-width: 800px) {

            .panels {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>🧠 AI Video Engine — Master Notes</h1>
    <p>Proje hafızası</p>
</header>

<main>

    <div class="panels">

        <!-- SOL PENCERE -->

        <section class="panel">

            <h2>📝 NOTLARIMIZ</h2>

            <textarea
                id="noteInput"
                placeholder="Önemli kararları, fikirleri ve notları buraya yaz..."
            ></textarea>

            <button onclick="addNote()">+ Not Ekle</button>

            <div id="notes" class="content">
                <div class="empty">
                    Notlar yükleniyor...
                </div>
            </div>

        </section>


        <!-- SAĞ PENCERE -->

        <section class="panel">

            <h2>🚀 PROJE AŞAMALARI</h2>

            <textarea
                id="progressInput"
                placeholder="Projenin ilerlemesini ve sonraki adımları buraya yaz..."
            ></textarea>

            <button onclick="addProgress()">+ Aşama Ekle</button>

            <div id="progress" class="content">
                <div class="empty">
                    Proje aşamaları yükleniyor...
                </div>
            </div>

        </section>

    </div>

</main>


<script>

    let notesData = {
        notes: []
    };

    let progressData = {
        project: "AI Video Engine",
        current_stage: "Temel mimari",
        completed: [],
        in_progress: [],
        next_steps: []
    };


    // NOTLARI YÜKLE

    async function loadNotes() {

        try {

            const response =
                await fetch("notes.json?" + Date.now());

            if (!response.ok) {
                throw new Error("notes.json bulunamadı.");
            }

            notesData = await response.json();

            renderNotes();

        } catch (error) {

            console.error(error);

            document.getElementById("notes").innerHTML =
                '<div class="empty">Henüz not yok.</div>';
        }
    }


    // PROJE AŞAMALARINI YÜKLE

    async function loadProgress() {

        try {

            const response =
                await fetch("progress.json?" + Date.now());

            if (!response.ok) {
                throw new Error("progress.json bulunamadı.");
            }

            progressData = await response.json();

            renderProgress();

        } catch (error) {

            console.error(error);

            document.getElementById("progress").innerHTML =
                '<div class="empty">Henüz aşama yok.</div>';
        }
    }


    // NOTLARI GÖSTER

    function renderNotes() {

        const container =
            document.getElementById("notes");

        if (
            !notesData.notes ||
            notesData.notes.length === 0
        ) {

            container.innerHTML =
                '<div class="empty">Henüz kayıtlı not yok.</div>';

            return;
        }

        container.innerHTML = "";

        [...notesData.notes].reverse().forEach(note => {

            const item =
                document.createElement("div");

            item.className = "item";

            item.innerHTML = `
                <div class="date">
                    ${escapeHtml(note.date || "")}
                </div>

                <div>
                    ${escapeHtml(note.text || "")}
                </div>
            `;

            container.appendChild(item);

        });
    }


    // PROJE AŞAMALARINI GÖSTER

    function renderProgress() {

        const container =
            document.getElementById("progress");

        let html = "";


        if (progressData.current_stage) {

            html += `
                <div class="item">

                    <div class="date">
                        MEVCUT AŞAMA
                    </div>

                    <strong>
                        ${escapeHtml(
                            progressData.current_stage
                        )}
                    </strong>

                </div>
            `;
        }


        if (
            progressData.completed &&
            progressData.completed.length
        ) {

            html += `
                <div class="item">

                    <div class="date">
                        TAMAMLANANLAR
                    </div>

                    ${progressData.completed
                        .map(x =>
                            "✓ " + escapeHtml(x)
                        )
                        .join("<br>")}

                </div>
            `;
        }


        if (
            progressData.in_progress &&
            progressData.in_progress.length
        ) {

            html += `
                <div class="item">

                    <div class="date">
                        DEVAM EDENLER
                    </div>

                    ${progressData.in_progress
                        .map(x =>
                            "⏳ " + escapeHtml(x)
                        )
                        .join("<br>")}

                </div>
            `;
        }


        if (
            progressData.next_steps &&
            progressData.next_steps.length
        ) {

            html += `
                <div class="item">

                    <div class="date">
                        SONRAKİ ADIMLAR
                    </div>

                    ${progressData.next_steps
                        .map(x =>
                            "→ " + escapeHtml(x)
                        )
                        .join("<br>")}

                </div>
            `;
        }


        if (!html) {

            html =
                '<div class="empty">Henüz aşama yok.</div>';
        }

        container.innerHTML = html;
    }


    // NOT EKLE

    function addNote() {

        const input =
            document.getElementById("noteInput");

        const text =
            input.value.trim();

        if (!text) {
            return;
        }


        notesData.notes.push({

            date:
                new Date().toLocaleString("tr-TR"),

            text: text

        });


        input.value = "";

        renderNotes();
    }


    // AŞAMA EKLE

    function addProgress() {

        const input =
            document.getElementById("progressInput");

        const text =
            input.value.trim();

        if (!text) {
            return;
        }


        progressData.in_progress.push(text);

        input.value = "";

        renderProgress();
    }


    // HTML GÜVENLİĞİ

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // BAŞLAT

    loadNotes();

    loadProgress();

</script>

</body>
</html>
